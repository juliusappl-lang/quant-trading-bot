[tool.poetry]
name = "quant-trading-bot"
version = "0.1.0"
description = "News-Driven Trading Signal Engine"
authors = ["Julius Appl <julius@appl.de>"]
readme = "README.md"
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.poetry.dependencies]
python = "^3.11"
yfinance = "^0.2"
pandas = "^2.2"
numpy = "^1.26"
matplotlib = "^3.9"
scikit-learn = "^1.5"
sentence-transformers = "^3.0"
vaderSentiment = "^3.3"
feedparser = "^6.0"
apscheduler = "^3.10"
joblib = "^1.4"
python-dotenv = "^1.0"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
httpx = "^0.27"
streamlit = "^1.35"
pydantic = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab (>=4.5.4,<5.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "ruff (>=0.15.2,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)"
]
